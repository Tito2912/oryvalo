[build]
  command = "npm run build"
  publish = ".next"

# -----------------------------------------------------------------------------
# Canonical host + HTTPS
# -----------------------------------------------------------------------------

[[redirects]]
  from = "http://oryvalo.com/*"
  to = "https://oryvalo.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.oryvalo.com/*"
  to = "https://oryvalo.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.oryvalo.com/*"
  to = "https://oryvalo.com/:splat"
  status = 301
  force = true

# -----------------------------------------------------------------------------
# Security + caching headers
# -----------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: blob: https://i.ytimg.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://www.gstatic.com https://plausible.io https://analytics.umami.is; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://www.googletagmanager.com https://*.google-analytics.com https://plausible.io https://analytics.umami.is; upgrade-insecure-requests"

[[headers]]
  for = "/_next/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
